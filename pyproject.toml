[tool.poetry]
name = "training-app"
version = "0.1.0"
description = "Training App API"
authors = ["Андрей <lukashunandrew@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
django = "^6.0.1"
djangorestframework = "^3.16.1"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.1"
djangorestframework-simplejwt = "^5.5.1"
django-debug-toolbar = "^6.2.0"
pymemcache = "^4.0.0"
django-redis = "^6.0.0"
drf-spectacular = "^0.29.0"
celery = {extras = ["rabbitmq"], version = "^5.6.2"}
flower = "^2.0.1"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
pytest = "^9.0.2"
pytest-django = "^4.11.1"
pytest-factoryboy = "^2.8.1"
factory-boy = "^3.3.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
    /t
    \.git
    | \.venv
    | __pycache__
    | migrations
    | env
    | venv
'''